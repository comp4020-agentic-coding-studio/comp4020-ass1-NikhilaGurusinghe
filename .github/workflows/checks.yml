name: checks

on:
  push:
    branches: [main]
  pull_request:
  # /ship dispatches a run after flipping the repo public, since the
  # visibility flip itself triggers no push event.
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Jobs only run once the repo is public: private-phase pushes would drain
    # the org's shared free Actions pool, and `pnpm check` runs the same
    # sensors locally while you build (public repos get unlimited minutes, so
    # cost ends at the flip).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan can see all commits
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # matches interactive-explainer/package.json's packageManager
      - run: bun install --frozen-lockfile
        working-directory: interactive-explainer
      - name: Typecheck, lint, and test
        run: bun run check
        working-directory: interactive-explainer
      - name: Check the process evidence
        # skipped in the template repo itself, where PROCESS.md is still the
        # boilerplate every student replaces. No package.json needed here ---
        # the script only touches node: built-ins, so bun can run it directly.
        if: ${{ !github.event.repository.is_template }}
        run: bun scripts/check-evidence.ts
      - name: Build the site
        run: bun run build
        working-directory: interactive-explainer
      - name: Run the spec
        # spec/*.test.ts and scripts/check-evidence.test.ts run against the
        # built site with `bun:test`. No root package.json/node_modules
        # needed: they use HTMLRewriter, which ships inside bun itself.
        run: bun test spec scripts
      - name: Check internal links
        run: bunx linkinator ./interactive-explainer/dist --silent
      - name: Scan for committed secrets
        # Pinned, both halves: the SHA fixes the action's script, and `version`
        # fixes the scanner image, which otherwise floats on :latest. These two
        # steps run in every repo in the course, so an upstream change would
        # break the whole cohort's CI in the same hour. Bump between semesters.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
      - name: Scan for a committed course key
        # The scan above reports only secrets it can confirm are live, and a
        # course key has no verifier a runner can reach --- see
        # .github/trufflehog.yml, which matches its shape instead.
        # CustomRegex scopes this pass to that file's detector, so the built-in
        # ones don't add unverified noise on top of it.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: >-
            --config=.github/trufflehog.yml
            --include-detectors=CustomRegex --results=unverified
            --no-verification

  deploy:
    needs: check
    # Pages can't serve a private repo on the free org anyway; the visibility
    # condition keeps a private-phase run from failing confusingly here.
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # matches interactive-explainer/package.json's packageManager
      - id: pages
        uses: actions/configure-pages@v6
      - run: bun install --frozen-lockfile
        working-directory: interactive-explainer
      - name: Build with Next.js
        run: bun run build
        working-directory: interactive-explainer
        env:
          # next.config.ts reads this for `basePath`, so the deployed site's
          # links resolve under the project's github.io/<repo>/ path.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./interactive-explainer/dist
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Verify the deployed site is online
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then echo "online: $url"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "site did not return 200"; exit 1
